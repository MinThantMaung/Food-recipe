<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
    <title>Food Recipe | Discover Delicious Recipes</title>
    <meta
      name="description"
      content="Discover delicious recipes from around the world. Explore ingredients, step-by-step cooking instructions, cuisines, and meal ideas for your next homemade dish."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Recipe</title>

    <style>
      html,
      body {
        margin: 0;
        background: #faf9f6;
      }

      .boot-loading,
      .boot-loading * {
        box-sizing: border-box;
      }

      .boot-loading {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0 24px;
        background: #faf9f6;
        font-family:
          ui-sans-serif, system-ui, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
          "Noto Color Emoji";
      }

      .boot-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        filter: blur(64px);
        pointer-events: none;
      }

      .boot-glow-top {
        top: -96px;
        left: -96px;
        background: rgb(255 237 213 / 60%);
      }

      .boot-glow-bottom {
        right: -96px;
        bottom: -96px;
        background: rgb(254 243 199 / 60%);
      }

      .boot-content {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 384px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .boot-brand {
        position: relative;
        display: flex;
        width: 128px;
        height: 128px;
        margin-bottom: 40px;
        align-items: center;
        justify-content: center;
      }

      .boot-ring,
      .boot-orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .boot-ring {
        border: 1px solid rgb(254 215 170 / 70%);
      }

      .boot-ring-inner {
        inset: 12px;
        border: 1px dashed rgb(254 215 170 / 80%);
      }

      .boot-orbit {
        animation: boot-spin 8s linear infinite;
      }

      .boot-orbit-dot {
        position: absolute;
        top: 0;
        left: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fb923c;
        box-shadow: 0 1px 3px #fed7aa;
        transform: translate(-50%, -50%);
      }

      .boot-icon-box {
        display: flex;
        width: 80px;
        height: 80px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: white;
        box-shadow:
          0 0 0 1px #ffedd5,
          0 20px 25px -5px rgb(124 45 18 / 5%),
          0 8px 10px -6px rgb(124 45 18 / 5%);
      }

      .boot-pot {
        width: 40px;
        height: 40px;
        color: #f97316;
      }

      .boot-label {
        margin-bottom: 12px;
        color: #ea580c;
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .boot-title {
        margin: 0;
        color: #292524;
        font-size: 24px;
        font-weight: 600;
        line-height: 32px;
        letter-spacing: -0.025em;
      }

      .boot-description {
        max-width: 256px;
        margin: 16px 0 0;
        color: #78716c;
        font-size: 14px;
        line-height: 1.625;
      }

      .boot-status {
        display: flex;
        margin-top: 32px;
        padding: 8px 16px;
        align-items: center;
        gap: 10px;
        border: 1px solid #ffedd5;
        border-radius: 9999px;
        background: rgb(255 255 255 / 80%);
        color: #78716c;
        font-size: 12px;
        font-weight: 500;
        line-height: 16px;
      }

      .boot-spinner {
        width: 14px;
        height: 14px;
        color: #f97316;
        animation: boot-spin 1s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 640px) {
        .boot-title {
          font-size: 30px;
          line-height: 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-orbit,
        .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        class="boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="boot-glow boot-glow-top" aria-hidden="true"></div>
        <div class="boot-glow boot-glow-bottom" aria-hidden="true"></div>

        <div class="boot-content">
          <div class="boot-brand" aria-hidden="true">
            <div class="boot-ring"></div>

            <div class="boot-orbit">
              <span class="boot-orbit-dot"></span>
            </div>

            <div class="boot-ring boot-ring-inner"></div>

            <div class="boot-icon-box">
              <!-- CookingPot icon -->
              <svg
                class="boot-pot"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12h20" />
                <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
                <path d="m4 8 16-4" />
                <path d="m8.86 6.78-.45-1.85a2 2 0 0 1 1.45-2.44l1.94-.5a2 2 0 0 1 2.45 1.45l.47 1.9" />
              </svg>
            </div>
          </div>

          <span class="boot-label">Food Recipe</span>

          <h1 class="boot-title">
            Something delicious<br />
            is on its way.
          </h1>

          <p class="boot-description">
            Getting your recipes ready for your next kitchen adventure.
          </p>

          <div class="boot-status">
            <!-- LoaderCircle icon -->
            <svg
              class="boot-spinner"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>

            <span>Preparing your table…</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
